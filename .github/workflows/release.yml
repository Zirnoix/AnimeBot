# Crée une release GitHub quand tu pousses un tag du type v1.0.2
# Usage : mets à jour le fichier VERSION à la racine, commit, puis :
#   git tag v1.0.2
#   git push origin v1.0.2
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
